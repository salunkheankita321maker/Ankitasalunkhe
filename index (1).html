<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diploma Types</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
        }

        header {
            text-align: center;
            padding: 20px;
            color: white;
            background-color: rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 250px;
            margin: 15px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .card h3 {
            text-align: center;
            padding: 10px;
            color: #333;
        }

        .card p {
            padding: 0 10px 15px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>Different Types of Diplomas</h1>
    <p>Explore various diploma courses</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1581090700227-1e8a8b1b4b2c" alt="Engineering">
        <h3>Engineering Diploma</h3>
        <p>Courses like Mechanical, Civil, Electrical, and Computer Engineering.</p>
    </div>
